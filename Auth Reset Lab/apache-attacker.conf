# The attacker's web server.
#
# 000-default.conf stays the default virtual host, so http://localhost is still
# the application. These two names are not: every request to them, whatever the
# path, is handled by collector.php.
<VirtualHost *:80>
    ServerName   attacker.hackinlab.internal
    ServerAlias  collector.hackinlab.internal
    DocumentRoot /var/www/html

    AliasMatch "^/.*$" "/var/www/html/collector.php"

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
